name: Build And Test Coverage Checks

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  JAVA_VERSION: 17
  JAVA_DISTRIBUTION: temurin

jobs:
  setup:
    uses: ./.github/workflows/setup.yml

  build:
    name: Build Application
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Restore Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ hashFiles('**/gradle-wrapper.properties', '**/*.gradle*', '**/settings.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-cache-${{ runner.os }}-
            gradle-cache-

      - name: Restore Project Setup
        uses: actions/cache@v4
        with:
          path: |
            local.properties
            app/google-services.json
            app/novix-release.jks
          key: ${{ needs.setup.outputs.project-setup-key }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run build
        run: ./gradlew assembleDebug --build-cache

  test:
    name: Test & Verify Coverage
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Restore Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ hashFiles('**/gradle-wrapper.properties', '**/*.gradle*', '**/settings.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-cache-${{ runner.os }}-
            gradle-cache-

      - name: Restore Project Setup
        uses: actions/cache@v4
        with:
          path: |
            local.properties
            app/google-services.json
            app/novix-release.jks
          key: ${{ needs.setup.outputs.project-setup-key }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run tests, and Kover report generation
        run: ./gradlew test koverHtmlReport --build-cache

      - name: Verify Coverage Threshold
        run: ./gradlew :koverVerify --build-cache

      - name: Upload HTML Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-html
          path: '**/build/reports/kover/html/'
