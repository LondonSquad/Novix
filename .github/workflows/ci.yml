name: Build And Test Coverage Checks

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

# Ensure that only the latest commit is tested for PRs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_test:
    name: Build & Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ hashFiles('**/gradle-wrapper.properties', '**/*.gradle*', '**/settings.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-cache-${{ runner.os }}-
            gradle-cache-

      - name: Setup Gradlew
        run: chmod +x ./gradlew

      - name: Decode Firebase Config
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "API_KEY=\"${{ secrets.TMDB_API_KEY }}\"" >> local.properties

      - name: Build and Test
        # This command runs the `test` task on all subprojects, which triggers Kover
        # Gradle will use its cache to only run tests on modules affected by changes.
        run: ./gradlew testDebugUnitTest

      - name: Upload Kover binary report
        # We upload the raw coverage data for the next job to use
        uses: actions/upload-artifact@v4
        with:
          name: kover-binary-report
          path: '**/build/kover/*.kover'

  coverage_report_and_verify:
    name: Analyze Code Coverage
    needs: build_and_test # This job only runs if build_and_test succeeds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ hashFiles('**/gradle-wrapper.properties', '**/*.gradle*', '**/settings.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-cache-

      - name: Setup Gradlew
        run: chmod +x ./gradlew

      - name: Download Kover binary report
        uses: actions/download-artifact@v4
        with:
          name: kover-binary-report
          path: build/kover-temp

      - name: Move binary reports to expected location
        # Kover needs the binary reports to be in their original paths to work
        run: |
          find build/kover-temp -type f -name '*.kover' | while read file; do
            # Extract the original module path from the artifact structure
            # e.g., from 'build/kover-temp/data/build/kover/debug.kover' -> 'data/build/kover/debug.kover'
            original_path=$(echo "$file" | sed -e 's|build/kover-temp/||')
            # Ensure the directory exists and move the file
            mkdir -p "$(dirname "$original_path")"
            mv "$file" "$original_path"
          done
          echo "Kover binary reports restored."

      - name: Generate Coverage Reports and Verify
        run: ./gradlew koverXmlReport koverVerify

      - name: Comment on PR with Code Coverage
        if: github.event_name == 'pull_request'
        uses: mi-kas/kover-report@v1
        with:
          path: build/reports/kover/report.xml # Path to the XML report generated above
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 80
          min-coverage-changed-files: 80
          update-comment: true
          title: Code Coverage Summary