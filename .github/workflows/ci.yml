name: Build And Test Coverage Checks

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

# Ensure that only the latest commit is tested for PRs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  JAVA_VERSION: 17
  JAVA_DISTRIBUTION: temurin

jobs:
  setup:
    name: Setup Cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ hashFiles('**/gradle-wrapper.properties', '**/*.gradle*', '**/settings.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-cache-${{ runner.os }}-
            gradle-cache-

      - name: Setup Gradlew
        run: chmod +x ./gradlew

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "API_KEY=\"${{ secrets.TMDB_API_KEY }}\"" >> local.properties
          echo "keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}" >> local.properties
          echo "keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}" >> local.properties
          echo "storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}" >> local.properties
          echo "storeFile=novix-release.jks" >> local.properties

      - name: Decode Firebase Config
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json

      - name: Decode Keystore
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE }}" | base64 --decode > app/novix-release.jks

      - name: Cache Project Setup
        uses: actions/cache@v4
        with:
          path: |
            local.properties
            app/google-services.json
            app/novix-release.jks
          key: project-setup-${{ github.sha }}

  build:
    name: Build Application
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Restore Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ hashFiles('**/gradle-wrapper.properties', '**/*.gradle*', '**/settings.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-cache-${{ runner.os }}-
            gradle-cache-

      - name: Restore Project Setup
        uses: actions/cache@v4
        with:
          path: |
            local.properties
            app/google-services.json
            app/novix-release.jks
          key: project-setup-${{ github.sha }}

      - name: Setup Gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test -x koverVerify --continue

  test:
    name: Test Coverage
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Restore Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ hashFiles('**/gradle-wrapper.properties', '**/*.gradle*', '**/settings.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-cache-${{ runner.os }}-
            gradle-cache-

      - name: Restore Project Setup
        uses: actions/cache@v4
        with:
          path: |
            local.properties
            app/google-services.json
            app/novix-release.jks
          key: project-setup-${{ github.sha }}

      - name: Setup Gradlew
        run: chmod +x ./gradlew

      - name: Clean Previous Reports
        run: |
          rm -rf build/reports/kover/
          find . -name "*.exec" -delete
          find . -name "kover" -type d -exec rm -rf {} + 2>/dev/null || true

      - name: Run Tests
        run: ./gradlew test --continue

      - name: Generate Kover Coverage Report
        run: ./gradlew koverXmlReport --info

      - name: Upload Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            build/reports/kover/report.xml
            **/build/reports/kover/**/*.xml
          retention-days: 30

      - name: Run Coverage Verification
        continue-on-error: true
        run: ./gradlew koverVerify

  analyze-pr:
    name: Analyze PR Code Coverage
    needs: test
    if: github.event_name == 'pull_request' && always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Coverage Reports
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports
          path: coverage/

      - name: Find Coverage Report
        id: find-report
        run: |
          REPORT_PATH=$(find coverage/ -name "report.xml" -path "*/build/reports/kover/*" | head -1)
          if [ -z "$REPORT_PATH" ]; then
            echo "No coverage report found"
            exit 1
          fi
          echo "report-path=$REPORT_PATH" >> $GITHUB_OUTPUT
          echo "Found coverage report at: $REPORT_PATH"

      - name: Comment PR with Overall Coverage
        uses: mi-kas/kover-report@v1
        with:
          path: ${{ steps.find-report.outputs.report-path }}
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 80
          min-coverage-changed-files: 80
          update-comment: true
          title: "📊 Code Coverage Report"