name: PR Metrics Updater

on:
  pull_request:
    types: [opened, closed, reopened, synchronize]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  update_pr_metrics:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request_review' ||
      (
        github.event_name == 'pull_request' &&
        (
          github.event.action == 'opened' ||
          github.event.action == 'closed' ||
          github.event.action == 'reopened' ||
          github.event.action == 'synchronize'
        )
      )

    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      REQUIRED_APPROVALS: 2

    steps:
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: develop

      # UPDATED: This step is now more descriptive and handles 'reopened' as a full refresh.
      - name: Determine Update Type
        id: prepare_data
        run: |
          EVENT_NAME="${{ github.event_name }}"
          PR_ACTION="${{ github.event.action }}"
          
          # This output will drive the logic in the next step.
          UPDATE_TYPE=""

          if [[ "$PR_ACTION" == "opened" ]]; then
            UPDATE_TYPE="PR_OPENED"
          elif [[ "$PR_ACTION" == "closed" ]]; then
            UPDATE_TYPE="PR_CLOSED"
          elif \
            [[ "$PR_ACTION" == "reopened" ]] || \
            [[ "$PR_ACTION" == "synchronize" ]] || \
            [[ "$PR_ACTION" == "dismissed" ]] || \
            [[ "$PR_ACTION" == "submitted" && "${{ github.event.review.state }}" == "approved" ]]; then
            # Any of these events mean the PR's state (diff, approvals) may have changed.
            # We will refetch the approval state from the API and update stats from the event payload.
            UPDATE_TYPE="PR_STATE_REFRESH"
          fi
          
          echo "UPDATE_TYPE=$UPDATE_TYPE" >> $GITHUB_OUTPUT
          echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          echo "PR_ACTION=$PR_ACTION" >> $GITHUB_OUTPUT

      # UPDATED: This step now handles diff_stats and uses the new 'PR_STATE_REFRESH' type.
      - name: Update pr_metrics.json
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PR_FILE="pr_metrics.json"
          UPDATE_TYPE="${{ steps.prepare_data.outputs.UPDATE_TYPE }}"
          PR_NUMBER_JQ="${{ steps.prepare_data.outputs.PR_NUMBER }}"
          PR_ACTION="${{ steps.prepare_data.outputs.PR_ACTION }}"

          if [[ -z "$UPDATE_TYPE" ]]; then
            echo "Event did not require an update. Exiting."
            exit 0
          fi

          echo "--- Updating metrics for PR #${PR_NUMBER_JQ} ---"
          echo "Update Type: $UPDATE_TYPE"

          # Ensure the JSON file exists and is valid, creating it if necessary
          if [ ! -f "$PR_FILE" ] || [ ! -s "$PR_FILE" ] || ! jq -e . >/dev/null 2>&1 < "$PR_FILE"; then
            echo "File $PR_FILE is missing, empty, or invalid. Initializing with empty array."
            echo "[]" > "$PR_FILE"
          fi
          
          JQ_DATA=$(cat "$PR_FILE")
          UPDATED_JQ_DATA=""

          JQ_RECALCULATE_FUNCTION='
            # Recalculates all approval-based metrics and status for a PR object.
            def recalculate_approval_metrics($required_approvals):
              # Helper to safely parse ISO 8601 timestamps to Unix epoch seconds.
              def parse_time(ts):
                (if ts then (ts | strptime("%Y-%m-%dT%H:%M:%SZ") | mktime) else null end);

              # Ensure approvals are sorted by time to correctly identify the first and Nth approval.
              .approvals |= sort_by(.submitted_at)

              # Recalculate first approval metrics.
              | .first_approved_at = (if (.approvals | length > 0) then .approvals[0].submitted_at else null end)
              | .time_to_first_approval_minutes = (if .first_approved_at then ((parse_time(.first_approved_at) - parse_time(.opened_at)) / 60) else null end)

              # Recalculate required approvals metrics.
              | .required_approvals_met_at = (if (.approvals | length) >= $required_approvals then .approvals[$required_approvals - 1].submitted_at else null end)
              | .time_to_required_approvals_minutes = (if .required_approvals_met_at then ((parse_time(.required_approvals_met_at) - parse_time(.opened_at)) / 60) else null end)

              # Recalculate the PR status, but do not overwrite a final state like "merged" or "closed".
              | .status = (
                  if .status == "merged" or .status == "closed" then .status 
                  elif .required_approvals_met_at != null then "approved"
                  else "pending"
                  end
                );
          '

          if [[ "$UPDATE_TYPE" == "PR_STATE_REFRESH" ]]; then
            echo "Fetching current approval state from GitHub API and updating diff stats..."
          
            PR_HEAD_SHA=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER_JQ" --jq '.head.sha')
            echo "Current PR HEAD SHA: $PR_HEAD_SHA"

            CURRENT_APPROVALS_JSON=$(gh api \
              "repos/${{ github.repository }}/pulls/$PR_NUMBER_JQ/reviews" \
              --jq '
                map(select(.state == "APPROVED" and .commit_id == "'"$PR_HEAD_SHA"'"))
                | group_by(.user.id)
                | map(sort_by(.submitted_at) | .[-1])
                | map({
                    reviewer: {login: .user.login, id: .user.id, url: .user.html_url},
                    submitted_at: .submitted_at
                  })
              ')
          
            echo "VALID approvals from API: $CURRENT_APPROVALS_JSON"

            UPDATED_JQ_DATA=$(echo "$JQ_DATA" | jq \
              --argjson pr_number "$PR_NUMBER_JQ" \
              --arg pr_action "$PR_ACTION" \
              --argjson additions ${{ github.event.pull_request.additions }} \
              --argjson deletions ${{ github.event.pull_request.deletions }} \
              --argjson changed_files ${{ github.event.pull_request.changed_files }} \
              --argjson current_approvals "$CURRENT_APPROVALS_JSON" \
              --argjson required_approvals "$REQUIRED_APPROVALS" \
              "$JQ_RECALCULATE_FUNCTION
               map(if .pr_number == \$pr_number then
                   # If the PR was reopened, clear the terminal state fields first.
                   (if \$pr_action == "reopened" then
                       .closed_at = null
                       | .merged_at = null
                       | .merged_by = null
                    else . end)
                   # Update diff stats from the current event payload.
                   | .diff_stats.additions = \$additions
                   | .diff_stats.deletions = \$deletions
                   | .diff_stats.changed_files = \$changed_files
                   # Overwrite the approvals array with the fresh, VALID list from the API.
                   | .approvals = \$current_approvals
                   # Then recalculate all metrics based on this new truth.
                   | recalculate_approval_metrics(\$required_approvals)
                 else . end)")

          elif [[ "$UPDATE_TYPE" == "PR_OPENED" ]]; then
            WEEK_NUMBER=$(date -d "${{ github.event.pull_request.created_at }}" +%G-W%V)
          
            # UPDATED: Add diff_stats to the new PR object
            NEW_PR_DATA=$(jq -n \
              --argjson pr_number "$PR_NUMBER_JQ" \
              --arg url "${{ github.event.pull_request.html_url }}" \
              --arg title "${{ github.event.pull_request.title }}" \
              --arg opened_at "${{ github.event.pull_request.created_at }}" \
              --arg head_ref "${{ github.event.pull_request.head.ref }}" \
              --arg base_ref "${{ github.event.pull_request.base.ref }}" \
              --arg creator_login "${{ github.event.pull_request.user.login }}" \
              --argjson creator_id "${{ github.event.pull_request.user.id }}" \
              --arg creator_html_url "${{ github.event.pull_request.user.html_url }}" \
              --argjson additions ${{ github.event.pull_request.additions }} \
              --argjson deletions ${{ github.event.pull_request.deletions }} \
              --argjson changed_files ${{ github.event.pull_request.changed_files }} \
              --arg week "$WEEK_NUMBER" \
              '
              {
                "pr_number": $pr_number,
                "url": $url,
                "title": $title,
                "opened_at": $opened_at,
                "head_ref": $head_ref,
                "base_ref": $base_ref,
                "creator": { "login": $creator_login, "id": $creator_id, "url": $creator_html_url },
                "approvals": [],
                "first_approved_at": null,
                "time_to_first_approval_minutes": null,
                "required_approvals_met_at": null,
                "time_to_required_approvals_minutes": null,
                "closed_at": null,
                "merged_at": null,
                "merged_by": null,
                "week": $week,
                "status": "pending",
                "diff_stats": {
                  "additions": $additions,
                  "deletions": $deletions,
                  "changed_files": $changed_files
                }
              }
              ')
            UPDATED_JQ_DATA=$(echo "$JQ_DATA" | jq --argjson pr_number "$PR_NUMBER_JQ" --argjson new_pr_data "$NEW_PR_DATA" 'if any(.[]; .pr_number == $pr_number) then . else . + [$new_pr_data] end')

          elif [[ "$UPDATE_TYPE" == "PR_CLOSED" ]]; then
            MERGED_BY_JSON='${{ toJSON(github.event.pull_request.merged_by) }}'
          
            UPDATED_JQ_DATA=$(echo "$JQ_DATA" | jq \
              --argjson pr_number "$PR_NUMBER_JQ" \
              --arg closed_at "${{ github.event.pull_request.closed_at }}" \
              --arg merged_at "${{ github.event.pull_request.merged_at }}" \
              --argjson merged_by "$MERGED_BY_JSON" \
              'map(if .pr_number == $pr_number then
                 .closed_at = $closed_at
                 | (if ($merged_at != null and $merged_at != "") then
                      .merged_at = $merged_at
                      | .merged_by = {login: $merged_by.login, id: $merged_by.id, url: $merged_by.html_url}
                      | .status = "merged"
                    else
                      .status = "closed"
                    end)
               else . end)')
          fi

          if jq -e . >/dev/null 2>&1 <<< "$UPDATED_JQ_DATA"; then
            echo "Update successful. Writing new data to $PR_FILE."
            # Pretty-print the JSON output to the file for better readability
            echo "$UPDATED_JQ_DATA" | jq '.' > "$PR_FILE"
          else
            echo "Generated data was empty or invalid. No changes were written."
          fi
          echo "--- END DEBUG ---"

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📊 Update PR metrics data"
          branch: develop
          commit_user_name: "london-bot[bot]"
          commit_user_email: "${{ vars.APP_ID }}+london-bot[bot]@users.noreply.github.com"
