name: PR Metrics Updater

on:
  pull_request:
    types: [opened, closed, reopened, synchronize]
  pull_request_review:
    types: [submitted, dismissed]

jobs:
  update_pr_metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      REQUIRED_APPROVALS: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare JSON data
        id: prepare_data
        run: |
          # --- Common PR data ---
          PR_NUMBER=${{ github.event.pull_request.number || github.event.pull_request_review.pull_request.number }}
          PR_URL="${{ github.event.pull_request.html_url || github.event.pull_request_review.pull_request.html_url }}"
          PR_TITLE="${{ github.event.pull_request.title || github.event.pull_request_review.pull_request.title }}"
          PR_CREATED_AT="${{ github.event.pull_request.created_at || github.event.pull_request_review.pull_request.created_at }}"
          PR_HEAD_REF="${{ github.event.pull_request.head.ref || github.event.pull_request_review.pull_request.head.ref }}"
          PR_BASE_REF="${{ github.event.pull_request.base.ref || github.event.pull_request_review.pull_request.base.ref }}"
          PR_USER_LOGIN="${{ github.event.pull_request.user.login || github.event.pull_request_review.pull_request.user.login }}"
          PR_USER_ID="${{ github.event.pull_request.user.id || github.event.pull_request_review.pull_request.user.id }}"
          PR_USER_HTML_URL="${{ github.event.pull_request.user.html_url || github.event.pull_request_review.pull_request.user.html_url }}"

          # Calculate ISO week number from PR_CREATED_AT
          # Use date command for robust week calculation (e.g., 2025-07-01T10:00:00Z -> 2025-W27)
          # Ensure PR_CREATED_AT is not empty before processing
          if [ -n "$PR_CREATED_AT" ]; then
            WEEK_NUMBER=$(date -d "$PR_CREATED_AT" +%G-W%V)
          else
            WEEK_NUMBER="unknown-week" # Fallback if created_at is unexpectedly empty
          fi

          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "PR_URL=$PR_URL" >> $GITHUB_OUTPUT
          echo "PR_TITLE=$PR_TITLE" >> $GITHUB_OUTPUT
          echo "PR_CREATED_AT=$PR_CREATED_AT" >> $GITHUB_OUTPUT
          echo "PR_HEAD_REF=$PR_HEAD_REF" >> $GITHUB_OUTPUT
          echo "PR_BASE_REF=$PR_BASE_REF" >> $GITHUB_OUTPUT
          echo "PR_USER_LOGIN=$PR_USER_LOGIN" >> $GITHUB_OUTPUT
          echo "PR_USER_ID=$PR_USER_ID" >> $GITHUB_OUTPUT
          echo "PR_USER_HTML_URL=$PR_USER_HTML_URL" >> $GITHUB_OUTPUT
          echo "WEEK_NUMBER=$WEEK_NUMBER" >> $GITHUB_OUTPUT # Add week number to output

          # --- Handle Approval Data ---
          if [[ "${{ github.event_name }}" == "pull_request_review" && "${{ github.event.review.state }}" == "approved" ]]; then
            REVIEWER_LOGIN="${{ github.event.review.user.login }}"
            REVIEWER_ID="${{ github.event.review.user.id }}"
            REVIEWER_HTML_URL="${{ github.event.review.user.html_url }}"
            APPROVAL_SUBMITTED_AT="${{ github.event.review.submitted_at }}"

            echo "REVIEWER_LOGIN=$REVIEWER_LOGIN" >> $GITHUB_OUTPUT
            echo "REVIEWER_ID=$REVIEWER_ID" >> $GITHUB_OUTPUT
            echo "REVIEWER_HTML_URL=$REVIEWER_HTML_URL" >> $GITHUB_OUTPUT
            echo "APPROVAL_SUBMITTED_AT=$APPROVAL_SUBMITTED_AT" >> $GITHUB_OUTPUT
            echo "EVENT_TYPE=approval" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "PR_ACTION=${{ github.event.action }}" >> $GITHUB_OUTPUT
            echo "PR_CLOSED_AT=${{ github.event.pull_request.closed_at }}" >> $GITHUB_OUTPUT
            echo "PR_MERGED_AT=${{ github.event.pull_request.merged_at }}" >> $GITHUB_OUTPUT
            echo "PR_MERGED_BY_LOGIN=${{ github.event.pull_request.merged_by.login }}" >> $GITHUB_OUTPUT
            echo "PR_MERGED_BY_ID=${{ github.event.pull_request.merged_by.id }}" >> $GITHUB_OUTPUT
            echo "PR_MERGED_BY_HTML_URL=${{ github.event.pull_request.merged_by.html_url }}" >> $GITHUB_OUTPUT
            echo "EVENT_TYPE=pr_lifecycle" >> $GITHUB_OUTPUT
          fi

      - name: Update pr_metrics.json
        run: |
          PR_FILE="pr_metrics.json"
          REQUIRED_APPROVALS=${{ env.REQUIRED_APPROVALS }}

          if [ ! -f "$PR_FILE" ]; then
            echo "[]" > "$PR_FILE"
          fi

          JQ_DATA=$(cat "$PR_FILE")

          EVENT_TYPE="${{ steps.prepare_data.outputs.EVENT_TYPE }}"
          PR_NUMBER_JQ=${{ steps.prepare_data.outputs.PR_NUMBER }}
          PR_CREATED_AT_JQ="${{ steps.prepare_data.outputs.PR_CREATED_AT }}" # Use this for time calculations
          WEEK_NUMBER_JQ="${{ steps.prepare_data.outputs.WEEK_NUMBER }}" # Use the calculated week number

          UPDATED_JQ_DATA=""

          if [[ "$EVENT_TYPE" == "approval" ]]; then
            UPDATED_JQ_DATA=$(echo "$JQ_DATA" | jq \
              --arg pr_number "$PR_NUMBER_JQ" \
              --arg reviewer_login "${{ steps.prepare_data.outputs.REVIEWER_LOGIN }}" \
              --arg reviewer_id "${{ steps.prepare_data.outputs.REVIEWER_ID }}" \
              --arg reviewer_html_url "${{ steps.prepare_data.outputs.REVIEWER_HTML_URL }}" \
              --arg approval_submitted_at "${{ steps.prepare_data.outputs.APPROVAL_SUBMITTED_AT }}" \
              --arg opened_at "$PR_CREATED_AT_JQ" \
              --argjson required_approvals "$REQUIRED_APPROVALS" \
              '
              map(if .pr_number == ($pr_number | tonumber) then
                # Add approval to the array if not already present by reviewer ID
                .approvals += [
                  {
                    reviewer: {login: $reviewer_login, id: ($reviewer_id | tonumber), url: $reviewer_html_url},
                    submitted_at: $approval_submitted_at
                  }
                ]
                | unique_by(.approvals[].reviewer.id) # Ensure unique approvals by reviewer ID
                # Always re-sort approvals by submitted_at to ensure latest is at the end (or relevant for Nth approval)
                | .approvals |= sort_by(.submitted_at)

                # Calculate first_approved_at and time_to_first_approval_minutes
                | (if .first_approved_at == null then
                     (
                       .first_approved_at = $approval_submitted_at
                     | .time_to_first_approval_minutes = (
                         ((strptime("%Y-%m-%dT%H:%M:%SZ") | mktime) - ($opened_at | strptime("%Y-%m-%dT%H:%M:%SZ") | mktime)) / 60
                       )
                     )
                   else .
                   end
                )

                # Check if required approvals are met
                | (if (.approvals | length) >= $required_approvals then
                     (
                       # Set required_approvals_met_at to the submitted_at of the Nth approval (N = required_approvals)
                       # Since approvals are sorted by submitted_at, the Nth element (index N-1) is the one that met the criteria
                       .required_approvals_met_at = (.approvals | .[($required_approvals - 1)].submitted_at)
                     | .time_to_required_approvals_minutes = (
                         ((.required_approvals_met_at | strptime("%Y-%m-%dT%H:%M:%SZ") | mktime) - ($opened_at | strptime("%Y-%m-%dT%H:%M:%SZ") | mktime)) / 60
                       )
                     | .status = "approved_required"
                     )
                   else
                     # If not enough approvals, ensure status is not "approved_required"
                     (if .status == "approved_required" then . else .status = "pending_approval" end)
                   end
                )
              else . end)
            ')
          elif [[ "$EVENT_TYPE" == "pr_lifecycle" ]]; then
            PR_ACTION="${{ steps.prepare_data.outputs.PR_ACTION }}"
            PR_CLOSED_AT="${{ steps.prepare_data.outputs.PR_CLOSED_AT }}"
            PR_MERGED_AT="${{ steps.prepare_data.outputs.PR_MERGED_AT }}"
            PR_MERGED_BY_LOGIN="${{ steps.prepare_data.outputs.PR_MERGED_BY_LOGIN }}"
            PR_MERGED_BY_ID="${{ steps.prepare_data.outputs.PR_MERGED_BY_ID }}"
            PR_MERGED_BY_HTML_URL="${{ steps.prepare_data.outputs.PR_MERGED_BY_HTML_URL }}"


            if [[ "$PR_ACTION" == "opened" ]]; then
              NEW_PR_DATA=$(jq -n \
                --arg pr_number "$PR_NUMBER_JQ" \
                --arg url "${{ steps.prepare_data.outputs.PR_URL }}" \
                --arg title "${{ steps.prepare_data.outputs.PR_TITLE }}" \
                --arg opened_at "$PR_CREATED_AT_JQ" \
                --arg head_ref "${{ steps.prepare_data.outputs.PR_HEAD_REF }}" \
                --arg base_ref "${{ steps.prepare_data.outputs.PR_BASE_REF }}" \
                --arg creator_login "${{ steps.prepare_data.outputs.PR_USER_LOGIN }}" \
                --arg creator_id "${{ steps.prepare_data.outputs.PR_USER_ID }}" \
                --arg creator_html_url "${{ steps.prepare_data.outputs.PR_USER_HTML_URL }}" \
                --arg week "$WEEK_NUMBER_JQ" \
                '{
                  "pr_number": ($pr_number | tonumber),
                  "url": $url,
                  "title": $title,
                  "opened_at": $opened_at,
                  "head_ref": $head_ref,
                  "base_ref": $base_ref,
                  "creator": { "login": $creator_login, "id": ($creator_id | tonumber), "url": $creator_html_url },
                  "approvals": [],
                  "first_approved_at": null,
                  "time_to_first_approval_minutes": null,
                  "required_approvals_met_at": null,
                  "time_to_required_approvals_minutes": null,
                  "closed_at": null,
                  "merged_at": null,
                  "merged_by": null,
                  "week": $week, # Correctly add the calculated week
                  "status": "pending_approval" # Initial status for new PRs
                }')

              UPDATED_JQ_DATA=$(echo "$JQ_DATA" | jq \
                --arg pr_number "$PR_NUMBER_JQ" \
                --argjson new_pr_data "$NEW_PR_DATA" \
                '
                # Check if PR exists, if so, update it, otherwise add it.
                # This handles both initial open and re-open scenarios more robustly.
                . as $original |
                if any(.pr_number == ($pr_number | tonumber)) then
                  map(if .pr_number == ($pr_number | tonumber) then
                    # If PR already exists, update it with new data (e.g., if re-opened)
                    # Preserve existing approvals if any, unless explicitly cleared by re-open
                    . + $new_pr_data | .approvals = (.approvals + $new_pr_data.approvals | unique_by(.reviewer.id) | sort_by(.submitted_at))
                  else . end)
                else
                  . + [$new_pr_data]
                end
                '
              )
            elif [[ "$PR_ACTION" == "closed" ]]; then
              UPDATED_JQ_DATA=$(echo "$JQ_DATA" | jq \
                --arg pr_number "$PR_NUMBER_JQ" \
                --arg closed_at "$PR_CLOSED_AT" \
                --arg merged_at "$PR_MERGED_AT" \
                --arg merged_by_login "$PR_MERGED_BY_LOGIN" \
                --arg merged_by_id "$PR_MERGED_BY_ID" \
                --arg merged_by_html_url "$PR_MERGED_BY_HTML_URL" \
                '
                map(if .pr_number == ($pr_number | tonumber) then
                  .closed_at = $closed_at
                  | (if ($merged_at | length > 0) then
                      .merged_at = $merged_at
                      | .merged_by = {login: $merged_by_login, id: ($merged_by_id | tonumber), url: $merged_by_html_url}
                      | .status = "merged"
                    else
                      .status = "closed"
                    end
                  )
                else . end)
              ')
            elif [[ "$PR_ACTION" == "reopened" ]]; then
              UPDATED_JQ_DATA=$(echo "$JQ_DATA" | jq \
                --arg pr_number "$PR_NUMBER_JQ" \
                '
                map(if .pr_number == ($pr_number | tonumber) then
                  .status = "pending_approval" # Reset status to pending upon reopen
                  | .closed_at = null
                  | .merged_at = null
                  | .merged_by = null
                  # Optionally, clear approval related timestamps if you want to re-evaluate approvals from scratch
                  # .first_approved_at = null
                  # | .time_to_first_approval_minutes = null
                  # | .required_approvals_met_at = null
                  # | .time_to_required_approvals_minutes = null
                  # | .approvals = [] # Uncomment this if you want to clear all previous approvals on reopen
                else . end)
              ')
            fi # End of PR_ACTION checks
          fi # End of EVENT_TYPE checks

          if [ -n "$UPDATED_JQ_DATA" ]; then
            echo "$UPDATED_JQ_DATA" > "$PR_FILE"
          else
            echo "No relevant update for PR #$PR_NUMBER_JQ from event type $EVENT_TYPE and action ${{ steps.prepare_data.outputs.PR_ACTION }}"
            cat "$PR_FILE" >&2 # Output current content for debug
          fi

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📊 Update PR metrics dashboard data (Required Approvals)"
