name: PR Metrics Updater

on:
  pull_request:
    types: [opened, closed, reopened, synchronize]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  update_pr_metrics:
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'pull_request_review' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      REQUIRED_APPROVALS: 2

    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: develop

      - name: Prepare JSON data
        id: prepare_data
        run: |
          EVENT_NAME="${{ github.event_name }}"
          PR_ACTION="${{ github.event.action }}"

          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_CREATED_AT="${{ github.event.pull_request.created_at }}"
          PR_HEAD_REF="${{ github.event.pull_request.head.ref }}"
          PR_BASE_REF="${{ github.event.pull_request.base.ref }}"
          PR_USER_LOGIN="${{ github.event.pull_request.user.login }}"
          PR_USER_ID="${{ github.event.pull_request.user.id }}"
          PR_USER_HTML_URL="${{ github.event.pull_request.user.html_url }}"

          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_OUTPUT

          if [[ "$EVENT_NAME" == "pull_request_review" ]]; then
            echo "REVIEWER_ID=${{ github.event.review.user.id }}" >> $GITHUB_OUTPUT
            echo "REVIEWER_LOGIN=${{ github.event.review.user.login }}" >> $GITHUB_OUTPUT

            if [[ "$PR_ACTION" == "submitted" && "${{ github.event.review.state }}" == "approved" ]]; then
              echo "EVENT_TYPE=approval" >> $GITHUB_OUTPUT
              echo "REVIEWER_HTML_URL=${{ github.event.review.user.html_url }}" >> $GITHUB_OUTPUT
              echo "APPROVAL_SUBMITTED_AT=${{ github.event.review.submitted_at }}" >> $GITHUB_OUTPUT
            elif [[ "$PR_ACTION" == "dismissed" ]]; then
              echo "EVENT_TYPE=dismissal" >> $GITHUB_OUTPUT
            fi

          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            WEEK_NUMBER=$(date -d "${PR_CREATED_AT}" +%G-W%V)
            {
              echo "PR_URL=$PR_URL"
              echo "PR_TITLE=$PR_TITLE"
              echo "PR_CREATED_AT=$PR_CREATED_AT"
              echo "PR_HEAD_REF=$PR_HEAD_REF"
              echo "PR_BASE_REF=$PR_BASE_REF"
              echo "PR_USER_LOGIN=$PR_USER_LOGIN"
              echo "PR_USER_ID=$PR_USER_ID"
              echo "PR_USER_HTML_URL=$PR_USER_HTML_URL"
              echo "WEEK_NUMBER=$WEEK_NUMBER"
              echo "PR_ACTION=$PR_ACTION"
              echo "PR_CLOSED_AT=${{ github.event.pull_request.closed_at }}"
              echo "PR_MERGED_AT=${{ github.event.pull_request.merged_at }}"
              echo "PR_MERGED_BY_LOGIN=${{ github.event.pull_request.merged_by.login }}"
              echo "PR_MERGED_BY_ID=${{ github.event.pull_request.merged_by.id }}"
              echo "PR_MERGED_BY_HTML_URL=${{ github.event.pull_request.merged_by.html_url }}"
              echo "EVENT_TYPE=pr_lifecycle"
            } >> $GITHUB_OUTPUT
          fi

      - name: Update pr_metrics.json
        run: |
          PR_FILE="pr_metrics.json"
          REQUIRED_APPROVALS=${{ env.REQUIRED_APPROVALS }}

          echo "--- DEBUG: Update pr_metrics.json Step ---"
          if [ ! -f "$PR_FILE" ] || [ ! -s "$PR_FILE" ] || ! jq -e . >/dev/null 2>&1 < "$PR_FILE"; then
            echo "File $PR_FILE is missing, empty, or invalid. Initializing with empty array."
            echo "[]" > "$PR_FILE"
          else
            echo "File $PR_FILE exists and has content."
          fi

          JQ_DATA=$(cat "$PR_FILE")
          EVENT_TYPE="${{ steps.prepare_data.outputs.EVENT_TYPE }}"
          PR_NUMBER_JQ="${{ steps.prepare_data.outputs.PR_NUMBER }}"
          UPDATED_JQ_DATA=""

          echo "PR_NUMBER_JQ: $PR_NUMBER_JQ"
          echo "EVENT_TYPE: $EVENT_TYPE"

          JQ_RECALCULATE_FUNCTION='
            def recalculate_approval_metrics($required_approvals):
              def parse_time(ts): (if ts then (ts | strptime("%Y-%m-%dT%H:%M:%SZ") | mktime) else null end);
          
              .approvals |= sort_by(.submitted_at)
          
              | .first_approved_at = (if (.approvals | length > 0) then .approvals[0].submitted_at else null end)
              | .time_to_first_approval_minutes = (if .first_approved_at then ((parse_time(.first_approved_at) - parse_time(.opened_at)) / 60) else null end)
          
              | .required_approvals_met_at = (if (.approvals | length) >= $required_approvals then .approvals[$required_approvals - 1].submitted_at else null end)
              | .time_to_required_approvals_minutes = (if .required_approvals_met_at then ((parse_time(.required_approvals_met_at) - parse_time(.opened_at)) / 60) else null end)
          
              | .status = (if .status == "merged" or .status == "closed" then .status 
                           elif .required_approvals_met_at != null then "approved"
                           else "pending_approval"
                           end);
          '

          if [[ "$EVENT_TYPE" == "approval" ]]; then
            UPDATED_JQ_DATA=$(echo "$JQ_DATA" | jq --argjson pr_number "$PR_NUMBER_JQ" --arg reviewer_login "${{ steps.prepare_data.outputs.REVIEWER_LOGIN }}" --argjson reviewer_id "${{ steps.prepare_data.outputs.REVIEWER_ID }}" --arg reviewer_html_url "${{ steps.prepare_data.outputs.REVIEWER_HTML_URL }}" --arg approval_submitted_at "${{ steps.prepare_data.outputs.APPROVAL_SUBMITTED_AT }}" --argjson required_approvals "$REQUIRED_APPROVALS" "$JQ_RECALCULATE_FUNCTION map(if .pr_number == \$pr_number then .approvals += [{reviewer: {login: \$reviewer_login, id: \$reviewer_id, url: \$reviewer_html_url}, submitted_at: \$approval_submitted_at}] | .approvals |= unique_by(.reviewer.id) | recalculate_approval_metrics(\$required_approvals) else . end)")
          elif [[ "$EVENT_TYPE" == "dismissal" ]]; then
            UPDATED_JQ_DATA=$(echo "$JQ_DATA" | jq --argjson pr_number "$PR_NUMBER_JQ" --argjson reviewer_id "${{ steps.prepare_data.outputs.REVIEWER_ID }}" --argjson required_approvals "$REQUIRED_APPROVALS" "$JQ_RECALCULATE_FUNCTION map(if .pr_number == \$pr_number then .approvals |= map(select(.reviewer.id != \$reviewer_id)) | recalculate_approval_metrics(\$required_approvals) else . end)")
          elif [[ "$EVENT_TYPE" == "pr_lifecycle" ]]; then
            PR_ACTION="${{ steps.prepare_data.outputs.PR_ACTION }}"
            if [[ "$PR_ACTION" == "opened" ]]; then
              NEW_PR_DATA=$(jq -n --argjson pr_number "$PR_NUMBER_JQ" --arg url "${{ steps.prepare_data.outputs.PR_URL }}" --arg title "${{ steps.prepare_data.outputs.PR_TITLE }}" --arg opened_at "${{ steps.prepare_data.outputs.PR_CREATED_AT }}" --arg head_ref "${{ steps.prepare_data.outputs.PR_HEAD_REF }}" --arg base_ref "${{ steps.prepare_data.outputs.PR_BASE_REF }}" --arg creator_login "${{ steps.prepare_data.outputs.PR_USER_LOGIN }}" --argjson creator_id "${{ steps.prepare_data.outputs.PR_USER_ID }}" --arg creator_html_url "${{ steps.prepare_data.outputs.PR_USER_HTML_URL }}" --arg week "${{ steps.prepare_data.outputs.WEEK_NUMBER }}" '{pr_number: $pr_number, url: $url, title: $title, opened_at: $opened_at, head_ref: $head_ref, base_ref: $base_ref, creator: { login: $creator_login, id: $creator_id, url: $creator_html_url }, approvals: [], first_approved_at: null, time_to_first_approval_minutes: null, required_approvals_met_at: null, time_to_required_approvals_minutes: null, closed_at: null, merged_at: null, merged_by: null, week: $week, status: "pending_approval"}')
              UPDATED_JQ_DATA=$(echo "$JQ_DATA" | jq --argjson pr_number "$PR_NUMBER_JQ" --argjson new_pr_data "$NEW_PR_DATA" 'if any(.[]; .pr_number == $pr_number) then map(if .pr_number == $pr_number then $new_pr_data else . end) else . + [$new_pr_data] end')
            elif [[ "$PR_ACTION" == "closed" ]]; then
              UPDATED_JQ_DATA=$(echo "$JQ_DATA" | jq --argjson pr_number "$PR_NUMBER_JQ" --arg closed_at "${{ steps.prepare_data.outputs.PR_CLOSED_AT }}" --arg merged_at "${{ steps.prepare_data.outputs.PR_MERGED_AT }}" --arg merged_by_login "${{ steps.prepare_data.outputs.PR_MERGED_BY_LOGIN }}" --argjson merged_by_id "${{ steps.prepare_data.outputs.PR_MERGED_BY_ID }}" --arg merged_by_html_url "${{ steps.prepare_data.outputs.PR_MERGED_BY_HTML_URL }}" 'map(if .pr_number == $pr_number then .closed_at = $closed_at | (if ($merged_at != null and $merged_at != "") then .merged_at = $merged_at | .merged_by = {login: $merged_by_login, id: $merged_by_id, url: $merged_by_html_url} | .status = "merged" else .status = "closed" end) else . end)')
            elif [[ "$PR_ACTION" == "reopened" ]]; then
              UPDATED_JQ_DATA=$(echo "$JQ_DATA" | jq --argjson pr_number "$PR_NUMBER_JQ" --argjson required_approvals "$REQUIRED_APPROVALS" "$JQ_RECALCULATE_FUNCTION map(if .pr_number == \$pr_number then .closed_at = null | .merged_at = null | .merged_by = null | recalculate_approval_metrics(\$required_approvals) else . end)")
            fi
          fi

          if jq -e . >/dev/null 2>&1 <<< "$UPDATED_JQ_DATA"; then
            echo "UPDATED_JQ_DATA is valid JSON. Writing to $PR_FILE."
            echo "$UPDATED_JQ_DATA" > "$PR_FILE"
          else
            echo "UPDATED_JQ_DATA IS EMPTY OR INVALID. No write performed. Event was likely not relevant."
          fi
          echo "--- END DEBUG ---"

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📊 Update PR metrics data"
          branch: develop
          # Correctly use the bot's display name, not its slug
          commit_user_name: "London Bot[bot]"
          commit_user_email: "${{ vars.APP_ID }}+london-bot[bot]@users.noreply.github.com"