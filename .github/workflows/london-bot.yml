name: London Bot

on:
  push:
    branches:
      - develop

  pull_request:
    types: [opened, closed, reopened, synchronize]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_dispatch:
    inputs:
      inputs:
        backfill_days:
          description: 'Number of days to look back for PRs'
          required: false
          default: 1
          type: number

      backfill_existing_prs:
        description: 'Backfill existing open PRs not in metrics'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  autoupdate:
    # Run on push to 'develop' OR pull_request events
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request'

    name: Auto Update
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      repository-projects: write

    steps:
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Configure Git
        run: |
          git config --global user.name "London Bot"
          git config --global user.email "220529784+london-bot[bot]@users.noreply.github.com"

      - uses: chinthakagodawita/autoupdate@v1.7.0
        id: autoupdate
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          DRY_RUN: "false"
          PR_FILTER: "protected"
          MERGE_MSG: "Branch was auto-updated."
          RETRY_COUNT: "5"
          RETRY_SLEEP: "300"
          MERGE_CONFLICT_ACTION: "ignore"

      - run: echo 'Merge conflicts found!'
        if: ${{ steps.autoupdate.outputs.conflicted }}

      - run: echo 'No merge conflicts'
        if: ${{ !steps.autoupdate.outputs.conflicted }}

  update_pr_metrics:
    name: Update Metrics
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request_review' ||
      (
        github.event_name == 'pull_request' &&
        (
          github.event.action == 'opened' ||
          github.event.action == 'closed' ||
          github.event.action == 'reopened' ||
          github.event.action == 'synchronize'
        )
      )

    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      REQUIRED_APPROVALS: 2

    steps:
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: metrics

      - name: Determine Update Type
        id: prepare_data
        run: |
          EVENT_NAME="${{ github.event_name }}"
          PR_ACTION="${{ github.event.action }}"
          BACKFILL="${{ github.event.inputs.backfill_existing_prs }}"
          
          UPDATE_TYPE=""

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$BACKFILL" == "true" ]]; then
            UPDATE_TYPE="BACKFILL_EXISTING_PRS"
          elif [[ "$PR_ACTION" == "opened" ]]; then
            UPDATE_TYPE="PR_OPENED"
          elif [[ "$PR_ACTION" == "closed" ]]; then
            UPDATE_TYPE="PR_CLOSED"
          elif \
            [[ "$PR_ACTION" == "reopened" ]] || \
            [[ "$PR_ACTION" == "synchronize" ]] || \
            [[ "$PR_ACTION" == "dismissed" ]] || \
            [[ "$PR_ACTION" == "submitted" && "${{ github.event.review.state }}" == "approved" ]]; then
            UPDATE_TYPE="PR_STATE_REFRESH"
          fi
          
          echo "UPDATE_TYPE=$UPDATE_TYPE" >> $GITHUB_OUTPUT
          echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          echo "PR_ACTION=$PR_ACTION" >> $GITHUB_OUTPUT

      - name: Backfill Existing PRs
        if: steps.prepare_data.outputs.UPDATE_TYPE == 'BACKFILL_EXISTING_PRS'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PR_FILE="pr_metrics.json"
          BACKFILL_DAYS="${{ steps.prepare_data.outputs.BACKFILL_DAYS || 1 }}"

          echo "--- Backfilling existing PRs (looking back $BACKFILL_DAYS days) ---"

          # Initialize file if needed
          if [ ! -f "$PR_FILE" ] || [ ! -s "$PR_FILE" ] || ! jq -e . >/dev/null 2>&1 < "$PR_FILE"; then
            echo "File $PR_FILE is missing, empty, or invalid. Initializing with empty array."
            echo "[]" > "$PR_FILE"
          fi

          # Get existing PR numbers from metrics file
          EXISTING_PRS=$(jq -r '.[].pr_number' "$PR_FILE" | tr '\n' ' ')
          echo "Existing PRs in metrics: $EXISTING_PRS"

          # Fetch all recent PRs from GitHub API (open and closed)
          ALL_PRS=$(gh api "repos/${{ github.repository }}/pulls?state=all" \
            --paginate \
            --jq '.[] | select(.created_at > "'$(date -d "$BACKFILL_DAYS days ago" +%Y-%m-%d)'") | .number' | tr '\n' ' ')
          echo "All recent PRs (last $BACKFILL_DAYS days): $ALL_PRS"

          # Find missing PRs
          MISSING_PRS=""
          for pr in $ALL_PRS; do
            if [[ ! " $EXISTING_PRS " =~ " $pr " ]]; then
              MISSING_PRS="$MISSING_PRS $pr"
            fi
          done

          echo "Missing PRs to backfill: $MISSING_PRS"

          if [[ -z "$MISSING_PRS" ]]; then
            echo "No missing PRs found. All recent PRs are already in metrics."
            exit 0
          fi

          JQ_DATA=$(cat "$PR_FILE")
   
          # Process each missing PR
          for pr_number in $MISSING_PRS; do
            echo "Processing PR #$pr_number..."

            # Fetch PR details
            PR_DATA=$(gh api "repos/${{ github.repository }}/pulls/$pr_number")

            # Extract all needed PR information
            PR_CLOSED_AT=$(echo "$PR_DATA" | jq -r '.closed_at // empty')
            PR_MERGED_AT=$(echo "$PR_DATA" | jq -r '.merged_at // empty')
            PR_MERGED_BY=$(echo "$PR_DATA" | jq '.merged_by | if . != null then {login: .login, id: .id, url: .html_url} else null end')

            # Determine status
            PR_STATUS="pending"
            if [[ -n "$PR_MERGED_AT" && "$PR_MERGED_AT" != "null" ]]; then
              PR_STATUS="merged"
            elif [[ -n "$PR_CLOSED_AT" && "$PR_CLOSED_AT" != "null" ]]; then
              PR_STATUS="closed"
            fi
          
            # Create new PR entry with all data
            NEW_PR_DATA=$(jq -n \
              --argjson pr_number "$pr_number" \
              --arg url "$(echo "$PR_DATA" | jq -r '.html_url')" \
              --arg title "$(echo "$PR_DATA" | jq -r '.title')" \
              --arg opened_at "$(echo "$PR_DATA" | jq -r '.created_at')" \
              --arg head_ref "$(echo "$PR_DATA" | jq -r '.head.ref')" \
              --arg base_ref "$(echo "$PR_DATA" | jq -r '.base.ref')" \
              --arg creator_login "$(echo "$PR_DATA" | jq -r '.user.login')" \
              --argjson creator_id "$(echo "$PR_DATA" | jq -r '.user.id')" \
              --arg creator_html_url "$(echo "$PR_DATA" | jq -r '.user.html_url')" \
              --argjson additions "$(echo "$PR_DATA" | jq -r '.additions // 0')" \
              --argjson deletions "$(echo "$PR_DATA" | jq -r '.deletions // 0')" \
              --argjson changed_files "$(echo "$PR_DATA" | jq -r '.changed_files // 0')" \
              --arg week "$(date -d "$(echo "$PR_DATA" | jq -r '.created_at')" +%G-W%V)" \
              --argjson current_approvals "$(gh api "repos/${{ github.repository }}/pulls/$pr_number/reviews" \
                --jq '[.[] | select(.state == "APPROVED" and .commit_id == "'$(echo "$PR_DATA" | jq -r '.head.sha')'")] |
                group_by(.user.id) | map(sort_by(.submitted_at) | .[-1]) |
                map({
                  reviewer: {
                    login: .user.login,
                    id: .user.id,
                    url: .user.html_url
                  },
                  submitted_at: .submitted_at
                })')" \
              --argjson required_approvals "$REQUIRED_APPROVALS" \
              --arg closed_at "$PR_CLOSED_AT" \
              --arg merged_at "$PR_MERGED_AT" \
              --argjson merged_by "$PR_MERGED_BY" \
              --arg status "$PR_STATUS" \
              '
              def recalculate_approval_metrics($required_approvals):
                def parse_time(ts): (if ts then (ts | strptime("%Y-%m-%dT%H:%M:%SZ") | mktime) else null end);
                .approvals |= sort_by(.submitted_at)
                | .first_approved_at = (if (.approvals | length > 0) then .approvals[0].submitted_at else null end)
                | .time_to_first_approval_minutes = (if .first_approved_at then ((parse_time(.first_approved_at) - parse_time(.opened_at)) / 60) else null end)
                | .required_approvals_met_at = (if (.approvals | length) >= $required_approvals then .approvals[$required_approvals - 1].submitted_at else null end)
                | .time_to_required_approvals_minutes = (if .required_approvals_met_at then ((parse_time(.required_approvals_met_at) - parse_time(.opened_at)) / 60) else null end)
                | .status = (if .status == "merged" or .status == "closed" then .status elif .required_approvals_met_at != null then "approved" else "pending" end);

              {
                "pr_number": $pr_number,
                "url": $url,
                "title": $title,
                "opened_at": $opened_at,
                "head_ref": $head_ref,
                "base_ref": $base_ref,
                "creator": {
                  "login": $creator_login,
                  "id": $creator_id,
                  "url": $creator_html_url
                },
                "approvals": $current_approvals,
                "first_approved_at": null,
                "time_to_first_approval_minutes": null,
                "required_approvals_met_at": null,
                "time_to_required_approvals_minutes": null,
                "closed_at": (if $closed_at != "" then $closed_at else null end),
                "merged_at": (if $merged_at != "" then $merged_at else null end),
                "merged_by": $merged_by,
                "week": $week,
                "status": $status,
                "diff_stats": {
                  "additions": $additions,
                  "deletions": $deletions,
                  "changed_files": $changed_files
                }
              } | recalculate_approval_metrics($required_approvals)
              ')

            # Insert the PR in the correct position (sorted by PR number)
            JQ_DATA=$(echo "$JQ_DATA" | jq \
            --argjson new_pr "$NEW_PR_DATA" \
            'sort_by(.pr_number) | 
               reduce .[] as $item ([]; 
                 if ($new_pr.pr_number < $item.pr_number) and (. | any(.pr_number == $new_pr.pr_number) | not) then 
                   . + [$new_pr, $item] 
                 else 
                   . + [$item] 
                 end) | 
               if any(.pr_number == $new_pr.pr_number) | not then 
                 . + [$new_pr] 
               else 
                 . 
               end | sort_by(.pr_number)')
            
            echo "Added PR #$pr_number to metrics with status: $PR_STATUS"
          done

          # Write updated data
          echo "$JQ_DATA" | jq '.' > "$PR_FILE"
          echo "Backfill completed. Added $(echo $MISSING_PRS | wc -w) PRs from the last $BACKFILL_DAYS days."

      - name: Update pr_metrics.json
        if: steps.prepare_data.outputs.UPDATE_TYPE != 'BACKFILL_EXISTING_PRS'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Common variables
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_ACTION: ${{ github.event.action }}
          # For PR_OPENED
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_CREATOR_LOGIN: ${{ github.event.pull_request.user.login }}
          PR_CREATOR_ID: ${{ github.event.pull_request.user.id }}
          PR_CREATOR_URL: ${{ github.event.pull_request.user.html_url }}
          # For PR_CLOSED
          PR_CLOSED_AT: ${{ github.event.pull_request.closed_at }}
          PR_MERGED_AT: ${{ github.event.pull_request.merged_at }}
          # For all events with diff stats
          PR_ADDITIONS: ${{ github.event.pull_request.additions }}
          PR_DELETIONS: ${{ github.event.pull_request.deletions }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          PR_FILE="pr_metrics.json"
          UPDATE_TYPE="${{ steps.prepare_data.outputs.UPDATE_TYPE }}"

          if [[ -z "$UPDATE_TYPE" ]]; then
            echo "Event did not require an update. Exiting."
            exit 0
          fi

          echo "--- Updating metrics for PR #${PR_NUMBER} ---"
          echo "Update Type: $UPDATE_TYPE"

          if [ ! -f "$PR_FILE" ] || [ ! -s "$PR_FILE" ] || ! jq -e . >/dev/null 2>&1 < "$PR_FILE"; then
            echo "File $PR_FILE is missing, empty, or invalid. Initializing with empty array."
            echo "[]" > "$PR_FILE"
          fi
          
          JQ_DATA=$(cat "$PR_FILE")
          UPDATED_JQ_DATA=""

          JQ_RECALCULATE_FUNCTION='
            def recalculate_approval_metrics($required_approvals):
              def parse_time(ts): (if ts then (ts | strptime("%Y-%m-%dT%H:%M:%SZ") | mktime) else null end);
              .approvals |= sort_by(.submitted_at)
              | .first_approved_at = (if (.approvals | length > 0) then .approvals[0].submitted_at else null end)
              | .time_to_first_approval_minutes = (if .first_approved_at then ((parse_time(.first_approved_at) - parse_time(.opened_at)) / 60) else null end)
              | .required_approvals_met_at = (if (.approvals | length) >= $required_approvals then .approvals[$required_approvals - 1].submitted_at else null end)
              | .time_to_required_approvals_minutes = (if .required_approvals_met_at then ((parse_time(.required_approvals_met_at) - parse_time(.opened_at)) / 60) else null end)
              | .status = (if .status == "merged" or .status == "closed" then .status elif .required_approvals_met_at != null then "approved" else "pending" end);
          '
          
          # Check if we have valid diff stats values
          HAS_VALID_DIFF_STATS=false
          if [[ -n "$PR_ADDITIONS" && -n "$PR_DELETIONS" && -n "$PR_CHANGED_FILES" ]]; then
            if [[ "$PR_ADDITIONS" =~ ^[0-9]+$ && "$PR_DELETIONS" =~ ^[0-9]+$ && "$PR_CHANGED_FILES" =~ ^[0-9]+$ ]]; then
              HAS_VALID_DIFF_STATS=true
              echo "Debug: Valid diff stats - ADDITIONS=$PR_ADDITIONS, DELETIONS=$PR_DELETIONS, CHANGED_FILES=$PR_CHANGED_FILES"
            else
              echo "Debug: Invalid diff stats values (not numeric) - skipping diff stats update"
            fi
          else
            echo "Debug: Missing diff stats values - skipping diff stats update"
          fi

          if [[ "$UPDATE_TYPE" == "PR_STATE_REFRESH" ]]; then
            echo "Fetching current approval state from GitHub API..."
            PR_HEAD_SHA=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq '.head.sha')
            CURRENT_APPROVALS_JSON=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews" \
            --jq '[.[] | select(.state == "APPROVED" and .commit_id == "'"$PR_HEAD_SHA"'")] |
            group_by(.user.id) | map(sort_by(.submitted_at) | .[-1]) |
            map({
              reviewer: {
                login: .user.login,
                id: .user.id,
                url: .user.html_url
              },
              submitted_at: .submitted_at
            })'
            )
            echo "VALID approvals from API: $CURRENT_APPROVALS_JSON"
          
            # Only update diff stats if we have valid values from the PR event
            if [[ "$HAS_VALID_DIFF_STATS" == "true" ]]; then
              echo "Updating diff stats for PR #$PR_NUMBER"
              UPDATED_JQ_DATA=$(echo "$JQ_DATA" | jq \
                --argjson pr_number "$PR_NUMBER" \
                --arg pr_action "$PR_ACTION" \
                --arg reopen_action "reopened" \
                --argjson additions "$PR_ADDITIONS" \
                --argjson deletions "$PR_DELETIONS" \
                --argjson changed_files "$PR_CHANGED_FILES" \
                --argjson current_approvals "$CURRENT_APPROVALS_JSON" \
                --argjson required_approvals "$REQUIRED_APPROVALS" \
                "$JQ_RECALCULATE_FUNCTION
                 map(if .pr_number == \$pr_number then
                     (if \$pr_action == \$reopen_action then .closed_at = null | .merged_at = null | .merged_by = null else . end)
                     | .diff_stats.additions = \$additions
                     | .diff_stats.deletions = \$deletions
                     | .diff_stats.changed_files = \$changed_files
                     | .approvals = \$current_approvals
                     | recalculate_approval_metrics(\$required_approvals)
                   else . end)")
            else
              echo "Skipping diff stats update, only updating approvals for PR #$PR_NUMBER"
              UPDATED_JQ_DATA=$(echo "$JQ_DATA" | jq \
                --argjson pr_number "$PR_NUMBER" \
                --arg pr_action "$PR_ACTION" \
                --arg reopen_action "reopened" \
                --argjson current_approvals "$CURRENT_APPROVALS_JSON" \
                --argjson required_approvals "$REQUIRED_APPROVALS" \
                "$JQ_RECALCULATE_FUNCTION
                 map(if .pr_number == \$pr_number then
                     (if \$pr_action == \$reopen_action then .closed_at = null | .merged_at = null | .merged_by = null else . end)
                     | .approvals = \$current_approvals
                     | recalculate_approval_metrics(\$required_approvals)
                   else . end)")
            fi

          elif [[ "$UPDATE_TYPE" == "PR_OPENED" ]]; then
            WEEK_NUMBER=$(date -d "$PR_CREATED_AT" +%G-W%V)
          
            # For new PRs, we need valid diff stats or default to 0
            SAFE_ADDITIONS=${PR_ADDITIONS:-0}
            SAFE_DELETIONS=${PR_DELETIONS:-0}
            SAFE_CHANGED_FILES=${PR_CHANGED_FILES:-0}
          
            # Validate that values are numeric for new PRs
            if ! [[ "$SAFE_ADDITIONS" =~ ^[0-9]+$ ]]; then
              SAFE_ADDITIONS=0
            fi
            if ! [[ "$SAFE_DELETIONS" =~ ^[0-9]+$ ]]; then
              SAFE_DELETIONS=0
            fi
            if ! [[ "$SAFE_CHANGED_FILES" =~ ^[0-9]+$ ]]; then
              SAFE_CHANGED_FILES=0
            fi
          
            echo "Debug: New PR - ADDITIONS=$SAFE_ADDITIONS, DELETIONS=$SAFE_DELETIONS, CHANGED_FILES=$SAFE_CHANGED_FILES"
          
            NEW_PR_DATA=$(jq -n \
              --argjson pr_number "$PR_NUMBER" \
              --arg url "$PR_URL" \
              --arg title "$PR_TITLE" \
              --arg opened_at "$PR_CREATED_AT" \
              --arg head_ref "$PR_HEAD_REF" \
              --arg base_ref "$PR_BASE_REF" \
              --arg creator_login "$PR_CREATOR_LOGIN" \
              --argjson creator_id "$PR_CREATOR_ID" \
              --arg creator_html_url "$PR_CREATOR_URL" \
              --argjson additions "$SAFE_ADDITIONS" \
              --argjson deletions "$SAFE_DELETIONS" \
              --argjson changed_files "$SAFE_CHANGED_FILES" \
              --arg week "$WEEK_NUMBER" \
              '
              {
                "pr_number": $pr_number,
                "url": $url,
                "title": $title,
                "opened_at": $opened_at,
                "head_ref": $head_ref,
                "base_ref": $base_ref,
                "creator": {
                  "login": $creator_login,
                  "id": $creator_id,
                  "url": $creator_html_url
                },
                "approvals": [],
                "first_approved_at": null,
                "time_to_first_approval_minutes": null,
                "required_approvals_met_at": null,
                "time_to_required_approvals_minutes": null,
                "closed_at": null,
                "merged_at": null,
                "merged_by": null,
                "week": $week,
                "status": "pending",
                "diff_stats": {
                  "additions": $additions,
                  "deletions": $deletions,
                  "changed_files": $changed_files
                }
              }
              ')
            UPDATED_JQ_DATA=$(echo "$JQ_DATA" | jq --argjson pr_number "$PR_NUMBER" --argjson new_pr_data "$NEW_PR_DATA" 'if any(.[]; .pr_number == $pr_number) then . else . + [$new_pr_data] end')

          elif [[ "$UPDATE_TYPE" == "PR_CLOSED" ]]; then
            # Only get merged_by data if the PR was actually merged
            MERGED_BY_JSON="null"
            if [[ -n "$PR_MERGED_AT" && "$PR_MERGED_AT" != "null" ]]; then
              MERGED_BY_JSON=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq '.merged_by // null')
            fi
          
            UPDATED_JQ_DATA=$(echo "$JQ_DATA" | jq \
              --argjson pr_number "$PR_NUMBER" \
              --arg closed_at "$PR_CLOSED_AT" \
              --arg merged_at "$PR_MERGED_AT" \
              --argjson merged_by "$(if [[ "$MERGED_BY_JSON" != "null" ]]; then echo "$MERGED_BY_JSON"; else echo 'null'; fi)" \
              'map(if .pr_number == $pr_number then
                 .closed_at = $closed_at
                 | (if ($merged_at != null and $merged_at != "") then
                      .merged_at = $merged_at
                      | .merged_by = (if $merged_by != null then {login: $merged_by.login, id: $merged_by.id, url: $merged_by.html_url} else null end)
                      | .status = "merged"
                    else
                      .status = "closed"
                    end)
               else . end)')
          fi

          if jq -e . >/dev/null 2>&1 <<< "$UPDATED_JQ_DATA"; then
            echo "Update successful. Writing new data to $PR_FILE."
            echo "$UPDATED_JQ_DATA" | jq '.' > "$PR_FILE"
          else
            echo "Generated data was empty or invalid. No changes were written."
            echo "Data that failed validation:"
            echo "$UPDATED_JQ_DATA"
            exit 1
          fi
          echo "--- END DEBUG ---"

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📊 Update PR metrics data"
          branch: metrics
          commit_user_name: "London Bot"
          commit_user_email: "220529784+london-bot[bot]@users.noreply.github.com"
