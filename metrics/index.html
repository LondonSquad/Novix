<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>London PR Metrics</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body class="bg-gray-100 p-8">
        <div class="container">
            <h1 class="text-4xl font-extrabold text-center text-gray-800 mb-8">
                <span class="bg-gradient-to-r from-blue-600 to-purple-600 text-transparent bg-clip-text">
                    London PR Metrics
                </span>
            </h1>
            <div id="dashboard-content" class="space-y-6">
                <!-- Loading progress indicator -->
                <div class="loading-container" id="loading-indicator">
                    <div class="spinner"></div>
                    <p class="text-center text-gray-600">Loading PR data...</p>
                </div>
                <!-- Error message -->
                <div class="error-container hidden" id="error-message">
                    <svg class="error-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <div>
                        <p class="font-bold">Error loading PR metrics!</p>
                        <p class="text-sm">Could not fetch `pr_metrics.json`. Displaying sample data instead.</p>
                        <p class="text-xs mt-1">Please ensure the file exists and is accessible. Check the browser console for more details.</p>
                    </div>
                </div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
